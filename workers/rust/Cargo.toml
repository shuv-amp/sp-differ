[package]
name = "sp-differ-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "sp_differ_worker_rust"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
secp256k1 = { version = "0.29", features = ["rand-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
