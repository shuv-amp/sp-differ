[package]
name = "sp-differ-semantic-adapter-bip352"
version = "0.1.0"
edition = "2021"

[lib]
name = "sp_differ_semantic_worker_bip352"
crate-type = ["cdylib", "rlib"]

[dependencies]
bech32 = "0.12"
bip352 = "0.1.0-alpha.3"
bitcoin = "0.31"
hex = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
