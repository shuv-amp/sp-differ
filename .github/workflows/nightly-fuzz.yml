name: Nightly Semantic Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION_FILE: ".python-version"
  RUST_TOOLCHAIN_VERSION: "1.92.0"

jobs:
  semantic-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: spdk
            make_target: fuzz-semantic-spdk
            report_prefix: spdk
          - name: silent-payments
            make_target: fuzz-semantic-silent-payments
            report_prefix: silent_payments
          - name: bip352
            make_target: fuzz-semantic-bip352
            report_prefix: bip352
          - name: go-bip352
            make_target: fuzz-semantic-go-bip352
            report_prefix: go_bip352
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version-file: ${{ env.PYTHON_VERSION_FILE }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: adapters/go_bip352/go.mod
          cache-dependency-path: adapters/go_bip352/go.sum

      - name: Longer deterministic semantic-worker fuzz
        run: make ${{ matrix.make_target }}
        env:
          FUZZ_SEED: 352
          FUZZ_STRUCTURED_ITERATIONS: 256
          FUZZ_RAW_ITERATIONS: 256

      - name: Package nightly fuzz artifacts
        if: always()
        run: |
          python scripts/package_ci_artifacts.py \
            --label nightly-fuzz-${{ matrix.name }} \
            --output build/ci_artifacts/nightly-fuzz-${{ matrix.name }}.tar \
            --path build/${{ matrix.report_prefix }}_semantic_fuzz_report.json \
            --path build/${{ matrix.report_prefix }}_semantic_fuzz_report.md \
            --path build/${{ matrix.report_prefix }}_semantic_fuzz_artifacts \
            --path fuzz/corpus/semantic_worker/manifest.json

      - name: Upload nightly fuzz artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-fuzz-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci_artifacts/nightly-fuzz-${{ matrix.name }}.tar
          if-no-files-found: error
          retention-days: 30
