name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RELEASE_VERSION: ${{ github.ref_name }}
  PYTHON_VERSION_FILE: ".python-version"
  RELEASE_SIGNING_ENABLED: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' && secrets.RELEASE_GPG_KEY_ID != '' && secrets.RELEASE_GPG_PASSPHRASE != '' }}

jobs:
  gatekeeper:
    name: Gatekeeper
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version-file: ${{ env.PYTHON_VERSION_FILE }}

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecp256k1-dev

      - name: Smoke and fuzz gate
        run: |
          make smoke SP_DIFFER_BUILD_VERSION="${RELEASE_VERSION}"
          make native-reference-fuzz SP_DIFFER_BUILD_VERSION="${RELEASE_VERSION}" FUZZ_SEED=352

  build-linux:
    name: Release Linux (${{ matrix.target }})
    needs: gatekeeper
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runs-on: ubuntu-24.04
            worker_lib: libsp_differ_worker.so
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
            worker_lib: libsp_differ_worker.so
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecp256k1-dev gnupg

      - name: Build release artifacts
        run: make release SP_DIFFER_BUILD_VERSION="${RELEASE_VERSION}"

      - name: Verify CLI integrity metadata
        run: |
          ./build/release/sp_differ_cli --check-integrity \
            --json-out build/release_integrity.json \
            --markdown-out build/release_integrity.md

      - name: Stage release directory
        run: |
          dist="build/dist/sp-differ-${RELEASE_VERSION}-${{ matrix.target }}"
          mkdir -p "$dist"
          cp build/release/sp_differ_runner "$dist/"
          cp build/release/sp_differ_compare "$dist/"
          cp build/release/sp_differ_cli "$dist/"
          cp "build/release/${{ matrix.worker_lib }}" "$dist/"
          cp build/release_integrity.json "$dist/"
          cp build/release_integrity.md "$dist/"

      - name: Import release signing key
        if: ${{ env.RELEASE_SIGNING_ENABLED == 'true' }}
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        run: |
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          gpg --batch --import "$key_file"
          rm -f "$key_file"

      - name: Generate signed checksums
        if: ${{ env.RELEASE_SIGNING_ENABLED == 'true' }}
        env:
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          ./scripts/sign_release.sh \
            --input-dir "build/dist/sp-differ-${RELEASE_VERSION}-${{ matrix.target }}" \
            --output-dir "build/dist/sp-differ-${RELEASE_VERSION}-${{ matrix.target }}" \
            --gpg-key "${{ secrets.RELEASE_GPG_KEY_ID }}"

      - name: Generate unsigned checksums
        if: ${{ env.RELEASE_SIGNING_ENABLED != 'true' }}
        run: |
          ./scripts/sign_release.sh \
            --input-dir "build/dist/sp-differ-${RELEASE_VERSION}-${{ matrix.target }}" \
            --output-dir "build/dist/sp-differ-${RELEASE_VERSION}-${{ matrix.target }}" \
            --allow-unsigned

      - name: Package archive
        run: |
          tar -czf "build/sp-differ-${RELEASE_VERSION}-${{ matrix.target }}.tar.gz" \
            -C build/dist "sp-differ-${RELEASE_VERSION}-${{ matrix.target }}"

      - name: Verify packaged archive
        run: |
          python3 scripts/verify_packaged_release.py \
            --archive "build/sp-differ-${RELEASE_VERSION}-${{ matrix.target }}.tar.gz" \
            --json-out "build/sp-differ-${RELEASE_VERSION}-${{ matrix.target }}-verification.json" \
            --markdown-out "build/sp-differ-${RELEASE_VERSION}-${{ matrix.target }}-verification.md"

      - name: Attest packaged archive
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: build/sp-differ-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sp-differ-${{ env.RELEASE_VERSION }}-${{ matrix.target }}
          path: build/sp-differ-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Stage release bundle
        run: |
          bundle="build/release-bundles/${{ matrix.target }}"
          dist="build/dist/sp-differ-${RELEASE_VERSION}-${{ matrix.target }}"
          mkdir -p "$bundle"
          cp "build/sp-differ-${RELEASE_VERSION}-${{ matrix.target }}.tar.gz" "$bundle/"
          cp "build/sp-differ-${RELEASE_VERSION}-${{ matrix.target }}-verification.json" "$bundle/"
          cp "build/sp-differ-${RELEASE_VERSION}-${{ matrix.target }}-verification.md" "$bundle/"
          cp "$dist/SHA256SUMS" "$bundle/sp-differ-${RELEASE_VERSION}-${{ matrix.target }}-SHA256SUMS"
          if [ -f "$dist/SHA256SUMS.asc" ]; then
            cp "$dist/SHA256SUMS.asc" "$bundle/sp-differ-${RELEASE_VERSION}-${{ matrix.target }}-SHA256SUMS.asc"
          fi

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sp-differ-${{ env.RELEASE_VERSION }}-${{ matrix.target }}-bundle
          path: build/release-bundles/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30

  build-macos-arch:
    name: Release macOS (${{ matrix.arch }})
    needs: gatekeeper
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: macos-15-intel
          - arch: arm64
            runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install native dependencies
        run: |
          brew update
          brew install secp256k1 gnupg

      - name: Build release artifacts
        run: make release SP_DIFFER_BUILD_VERSION="${RELEASE_VERSION}"

      - name: Verify CLI integrity metadata
        run: |
          ./build/release/sp_differ_cli --check-integrity \
            --json-out build/release_integrity.json \
            --markdown-out build/release_integrity.md

      - name: Stage per-arch release directory
        run: |
          dist="build/macos-arch/${{ matrix.arch }}"
          mkdir -p "$dist"
          cp build/release/sp_differ_runner "$dist/"
          cp build/release/sp_differ_compare "$dist/"
          cp build/release/sp_differ_cli "$dist/"
          cp build/release/libsp_differ_worker.dylib "$dist/"
          cp build/release_integrity.json "$dist/"
          cp build/release_integrity.md "$dist/"

      - name: Upload per-arch macOS binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}-raw-${{ env.RELEASE_VERSION }}
          path: build/macos-arch/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  build-macos-universal:
    name: Release macOS Universal
    needs: build-macos-arch
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install signing tools
        run: |
          brew update
          brew install gnupg

      - name: Download arm64 binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-arm64-raw-${{ env.RELEASE_VERSION }}
          path: build/macos-raw/arm64

      - name: Download x86_64 binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-x86_64-raw-${{ env.RELEASE_VERSION }}
          path: build/macos-raw/x86_64

      - name: Create universal binaries
        run: |
          dist="build/dist/sp-differ-${RELEASE_VERSION}-macos-universal"
          mkdir -p "$dist"
          lipo -create build/macos-raw/arm64/sp_differ_runner build/macos-raw/x86_64/sp_differ_runner -output "$dist/sp_differ_runner"
          lipo -create build/macos-raw/arm64/sp_differ_compare build/macos-raw/x86_64/sp_differ_compare -output "$dist/sp_differ_compare"
          lipo -create build/macos-raw/arm64/sp_differ_cli build/macos-raw/x86_64/sp_differ_cli -output "$dist/sp_differ_cli"
          lipo -create build/macos-raw/arm64/libsp_differ_worker.dylib build/macos-raw/x86_64/libsp_differ_worker.dylib -output "$dist/libsp_differ_worker.dylib"
          chmod +x "$dist/sp_differ_runner" "$dist/sp_differ_compare" "$dist/sp_differ_cli"

      - name: Verify universal CLI integrity metadata
        run: |
          cli_path="./build/dist/sp-differ-${RELEASE_VERSION}-macos-universal/sp_differ_cli"
          json_path="build/dist/sp-differ-${RELEASE_VERSION}-macos-universal/release_integrity.json"
          markdown_path="build/dist/sp-differ-${RELEASE_VERSION}-macos-universal/release_integrity.md"
          "$cli_path" --check-integrity \
            --json-out "$json_path" \
            --markdown-out "$markdown_path"

      - name: Import release signing key
        if: ${{ env.RELEASE_SIGNING_ENABLED == 'true' }}
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        run: |
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          gpg --batch --import "$key_file"
          rm -f "$key_file"

      - name: Generate signed checksums
        if: ${{ env.RELEASE_SIGNING_ENABLED == 'true' }}
        env:
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          ./scripts/sign_release.sh \
            --input-dir "build/dist/sp-differ-${RELEASE_VERSION}-macos-universal" \
            --output-dir "build/dist/sp-differ-${RELEASE_VERSION}-macos-universal" \
            --gpg-key "${{ secrets.RELEASE_GPG_KEY_ID }}"

      - name: Generate unsigned checksums
        if: ${{ env.RELEASE_SIGNING_ENABLED != 'true' }}
        run: |
          ./scripts/sign_release.sh \
            --input-dir "build/dist/sp-differ-${RELEASE_VERSION}-macos-universal" \
            --output-dir "build/dist/sp-differ-${RELEASE_VERSION}-macos-universal" \
            --allow-unsigned

      - name: Package archive
        run: |
          tar -czf "build/sp-differ-${RELEASE_VERSION}-macos-universal.tar.gz" \
            -C build/dist "sp-differ-${RELEASE_VERSION}-macos-universal"

      - name: Verify packaged archive
        run: |
          python3 scripts/verify_packaged_release.py \
            --archive "build/sp-differ-${RELEASE_VERSION}-macos-universal.tar.gz" \
            --json-out "build/sp-differ-${RELEASE_VERSION}-macos-universal-verification.json" \
            --markdown-out "build/sp-differ-${RELEASE_VERSION}-macos-universal-verification.md"

      - name: Attest packaged archive
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: build/sp-differ-${{ env.RELEASE_VERSION }}-macos-universal.tar.gz

      - name: Upload universal archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sp-differ-${{ env.RELEASE_VERSION }}-macos-universal
          path: build/sp-differ-${{ env.RELEASE_VERSION }}-macos-universal.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Stage universal release bundle
        run: |
          bundle="build/release-bundles/macos-universal"
          dist="build/dist/sp-differ-${RELEASE_VERSION}-macos-universal"
          mkdir -p "$bundle"
          cp "build/sp-differ-${RELEASE_VERSION}-macos-universal.tar.gz" "$bundle/"
          cp "build/sp-differ-${RELEASE_VERSION}-macos-universal-verification.json" "$bundle/"
          cp "build/sp-differ-${RELEASE_VERSION}-macos-universal-verification.md" "$bundle/"
          cp "$dist/SHA256SUMS" "$bundle/sp-differ-${RELEASE_VERSION}-macos-universal-SHA256SUMS"
          if [ -f "$dist/SHA256SUMS.asc" ]; then
            cp "$dist/SHA256SUMS.asc" "$bundle/sp-differ-${RELEASE_VERSION}-macos-universal-SHA256SUMS.asc"
          fi

      - name: Upload universal release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sp-differ-${{ env.RELEASE_VERSION }}-macos-universal-bundle
          path: build/release-bundles/macos-universal
          if-no-files-found: error
          retention-days: 30

  publish-release-draft:
    name: Publish Draft Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-linux
      - build-macos-universal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download Linux x64 release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sp-differ-${{ env.RELEASE_VERSION }}-linux-x64-bundle
          path: build/release-bundles/linux-x64

      - name: Download Linux arm64 release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sp-differ-${{ env.RELEASE_VERSION }}-linux-arm64-bundle
          path: build/release-bundles/linux-arm64

      - name: Download macOS universal release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sp-differ-${{ env.RELEASE_VERSION }}-macos-universal-bundle
          path: build/release-bundles/macos-universal

      - name: Create draft GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          draft_state="$(gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [ "$draft_state" = "false" ]; then
            echo "published release ${RELEASE_VERSION} already exists; refusing to mutate an immutable release"
            exit 1
          fi
          if [ "$draft_state" = "true" ]; then
            gh release delete "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag=false --yes
          fi

          notes_file="build/release-notes.md"
          mkdir -p build
          cat > "$notes_file" <<'EOF'
          Release candidate assets for this tag.

          Verification checklist:
          - Verify the signed tag before publication.
          - Verify the attached per-platform SHA256SUMS files against the attached KEYS file.
          - Review the attached packaged-release verification reports for each archive.
          - Verify the GitHub-hosted provenance attestations for the published tarballs before final publication.

          This release stays in draft so maintainers can review asset completeness and notes before immutable publication.
          EOF

          shopt -s nullglob
          assets=(
            KEYS
            build/release-bundles/linux-x64/*
            build/release-bundles/linux-arm64/*
            build/release-bundles/macos-universal/*
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no release assets staged"
            exit 1
          fi

          gh release create "${RELEASE_VERSION}" \
            "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --verify-tag \
            --title "SP-DIFFER ${RELEASE_VERSION}" \
            --notes-file "$notes_file"
